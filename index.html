<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Andebol - Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white antialiased">

    <div id="welcomeModal" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 rounded-2xl p-8 w-full max-w-md text-center shadow-2xl">
            <h2 class="text-3xl font-bold text-blue-400 mb-4">Preparar Jogo</h2>
            <div class="space-y-4 mb-6">
                <div class="bg-gray-700 p-3 rounded-lg">
                    <p class="text-sm text-gray-300 mb-2 font-semibold">Duração da Parte:</p>
                    <div class="flex justify-center gap-6">
                        <label class="inline-flex items-center cursor-pointer"><input type="radio" name="gameDuration" value="30" class="form-radio text-blue-500 h-5 w-5" checked><span class="ml-2 text-white font-bold">30 min</span></label>
                        <label class="inline-flex items-center cursor-pointer"><input type="radio" name="gameDuration" value="25" class="form-radio text-blue-500 h-5 w-5"><span class="ml-2 text-white font-bold">25 min</span></label>
                    </div>
                </div>
                <div class="space-y-3">
                    <div>
                        <input type="file" id="welcome-file-input-A" class="hidden" accept=".hpo-match.json,.json,application/json">
                        <label for="welcome-file-input-A" class="cursor-pointer w-full block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition flex items-center justify-center gap-2"><span>📁</span> Carregar jogo HPO-MATCH</label>
                    </div>
                    <p id="file-name-A" class="text-sm text-gray-500 h-5 truncate">Nenhum ficheiro selecionado</p>
                </div>
                <input type="text" id="welcome-team-b-name" placeholder="Nome do Adversário" class="w-full bg-gray-700 text-white text-center p-3 rounded-lg">
            </div>
            <button id="startGameBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg disabled:opacity-50" disabled>Começar Jogo</button>
        </div>
    </div>

    <div id="main-app" class="container mx-auto p-4 hidden">
        <div class="bg-gray-800 p-4 rounded-2xl shadow-lg mb-6 text-center">
            <div class="flex justify-between mb-2">
                <input type="text" id="teamAName" readonly class="bg-transparent text-blue-400 font-bold text-xl text-center w-1/3">
                <span class="text-gray-500">vs</span>
                <input type="text" id="teamBName" class="bg-transparent text-orange-400 font-bold text-xl text-center w-1/3">
            </div>
            <div class="flex justify-center items-center gap-8"><div class="text-6xl font-bold" id="scoreA">0</div><div class="text-4xl text-gray-600">-</div><div class="text-6xl font-bold" id="scoreB">0</div></div>
            <div class="grid grid-cols-4 gap-4 mt-4 text-sm text-gray-400"><div>Eficácia: <span id="effA" class="text-white">0%</span></div><div>Remates: <span id="shotsA" class="text-white">0</span></div><div>Defesas GR: <span id="savesA" class="text-white">0</span></div><div>Faltas Téc: <span id="techFaultsA" class="text-white">0</span></div></div>
        </div>
        <div class="bg-gray-800 p-6 rounded-2xl shadow-lg text-center mb-6">
            <div class="flex justify-center items-center gap-4 mb-4"><div id="timer" class="text-7xl font-mono tracking-widest text-white">00:00</div><div id="suspension-container" class="flex flex-col gap-1 text-xs"></div></div>
            <div class="grid grid-cols-3 gap-4"><button id="startBtn" class="btn-feedback bg-green-600 text-white font-bold py-4 rounded-xl text-lg md:text-xl">Iniciar</button><button id="pauseBtn" class="btn-feedback bg-yellow-600 text-white font-bold py-4 rounded-xl text-lg md:text-xl">Pausar</button><button id="editTimerBtn" class="btn-feedback bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl text-lg md:text-xl" disabled>Corrigir</button></div>
            <div class="grid grid-cols-2 gap-2 mt-4"><button id="passivePlayBtn" class="btn-feedback bg-gray-700 text-white font-bold py-2 rounded-lg">Jogo Passivo ✋</button><button id="opponent7v6Btn" class="btn-feedback bg-gray-700 text-white font-bold py-2 rounded-lg">Adversário 7x6 🏃</button></div>
            <div class="flex gap-2 mt-4"><button id="undoBtn" class="flex-1 bg-gray-600 hover:bg-gray-500 text-white py-2 rounded-lg font-bold">↩ Desfazer</button><button id="exportExcelBtn" class="flex-1 bg-green-700 hover:bg-green-600 text-white py-2 rounded-lg font-bold">📊 Excel</button><button id="resetGameBtn" class="flex-1 border border-red-600 text-red-500 hover:bg-red-600 hover:text-white py-2 rounded-lg font-bold">⚠️ Novo Jogo</button></div>
        </div>
        <div class="flex space-x-2 mb-4 overflow-x-auto pb-2 border-b border-gray-700"><button class="tab-link active flex-1 py-3 px-4 bg-gray-700 hover:bg-gray-600 rounded-t-lg font-bold text-white border-b-4 border-blue-500 transition" data-tab="data">📝 Dados</button><button class="tab-link flex-1 py-3 px-4 bg-gray-800 hover:bg-gray-700 rounded-t-lg font-bold text-gray-400 hover:text-white transition" data-tab="stats">📈 Estatística</button><button class="tab-link flex-1 py-3 px-4 bg-gray-800 hover:bg-gray-700 rounded-t-lg font-bold text-gray-400 hover:text-white transition" data-tab="heatmap">🔥 Heatmap</button></div>
        <div id="tab-data" class="tab-content block">
