<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Campo de andebol — zonas de remate</title>
  <desc id="desc">Reprodução vetorial do esquema de referência. A área do guarda-redes é a área interior da linha dos 6 metros e não pertence a nenhuma zona.</desc>
  <rect width="1024" height="1024" fill="#fff"/>
  <!-- campo -->
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="52" y="69" width="920" height="904"/>
    <!-- linha de 6 m / área do GR: NÃO É UMA ZONA -->
    <path d="M211 69 A301 259 0 0 0 813 69"/>
    <!-- linha de 9 m -->
    <path d="M52 110 A460 400 0 0 0 972 110" stroke-dasharray="13 10"/>
    <!-- prolongamentos que fecham os setores laterais -->
    <path d="M132 359 L211 277"/>
    <path d="M892 359 L813 277"/>
    <!-- divisão dos setores longos -->
    <path d="M343 510 V754"/>
    <path d="M681 510 V754"/>
    <!-- início da zona 9 -->
    <path d="M52 754 H972"/>
  </g>
  <!-- baliza -->
  <g fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M431 69 H593"/>
    <path d="M431 69 L426 42 H598 L593 69"/>
    <path d="M426 42 V69 M598 42 V69"/>
    <path d="M438 32 H586"/>
    <path d="M438 32 L433 27 H591 L586 32"/>
    <path d="M446 27 V19 H578 V27"/>
    <path d="M446 19 L441 16 H583 L578 19"/>
    <path d="M441 69 L450 96 M583 69 L574 96"/>
    <!-- rede -->
    <path d="M442 30 H582 M448 38 H576 M454 46 H570" stroke-width="2"/>
    <path d="M450 22 V68 M462 22 V75 M474 22 V80 M486 22 V84 M498 22 V87 M510 22 V88 M522 22 V87 M534 22 V84 M546 22 V80 M558 22 V75 M570 22 V68" stroke-width="2"/>
  </g>
  <g fill="#111">
    <circle cx="512" cy="221" r="11"/>
    <circle cx="512" cy="972" r="10"/>
  </g>
  <!-- etiquetas exatamente nas 9 zonas; a área do GR fica sem etiqueta -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="40" fill="#111" text-anchor="middle">
    <text x="143" y="230">Zona 1</text>
    <text x="292" y="389">Zona 2</text>
    <text x="512" y="428">Zona 3</text>
    <text x="732" y="389">Zona 4</text>
    <text x="881" y="230">Zona 5</text>
    <text x="145" y="619">Zona 6</text>
    <text x="512" y="619">Zona 7</text>
    <text x="879" y="619">Zona 8</text>
    <text x="512" y="866">Zona 9</text>
  </g>
</svg>
