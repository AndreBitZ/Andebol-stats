<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Campo de andebol — zonas de remate</title>
  <desc id="desc">Esquema de referência para zonas de remate. A área do guarda-redes, dentro da linha dos 6 metros, não pertence a nenhuma zona.</desc>
  <rect width="1024" height="1024" fill="#fff"/>

  <!-- Campo -->
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="52" y="70" width="920" height="904"/>

    <!-- Área do GR / linha dos 6 m: NÃO É UMA ZONA -->
    <path d="M211 70 C211 70 211 327 512 327 C813 327 813 70 813 70"/>

    <!-- Linhas laterais que ligam a área do GR aos setores -->
    <path d="M132 360 L264 242"/>
    <path d="M892 360 L760 242"/>

    <!-- Linha dos 9 m tracejada -->
    <path d="M53 99 C53 99 53 512 512 512 C971 512 971 99 971 99" stroke-dasharray="13 10"/>

    <!-- Divisões dos setores 2/3/4 -->
    <path d="M343 508 L407 327"/>
    <path d="M681 508 L617 327"/>

    <!-- Divisões dos setores 6/7/8 -->
    <path d="M343 508 V754"/>
    <path d="M681 508 V754"/>

    <!-- Início da zona 9 -->
    <path d="M52 754 H972"/>
  </g>

  <!-- Baliza e rede, como na referência -->
  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="4">
      <path d="M430 70 H594"/>
      <path d="M430 70 L425 43 H599 L594 70"/>
      <path d="M425 43 V70 M599 43 V70"/>
      <path d="M438 32 H586"/>
      <path d="M438 32 L433 27 H591 L586 32"/>
      <path d="M446 27 V19 H578 V27"/>
      <path d="M446 19 L441 16 H583 L578 19"/>
      <path d="M441 70 L450 96 M583 70 L574 96"/>
    </g>
    <g stroke-width="1.5">
      <path d="M442 30 H582 M448 38 H576 M454 46 H570"/>
      <path d="M450 22 V68 M462 22 V75 M474 22 V80 M486 22 V84 M498 22 V87 M510 22 V88 M522 22 V87 M534 22 V84 M546 22 V80 M558 22 V75 M570 22 V68"/>
    </g>
  </g>

  <!-- Pontos de referência -->
  <g fill="#111">
    <circle cx="512" cy="221" r="11"/>
    <circle cx="512" cy="972" r="10"/>
  </g>

  <!-- Zonas: a área do GR fica deliberadamente sem etiqueta -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="40" fill="#111" text-anchor="middle">
    <text x="145" y="230">Zona 1</text>
    <text x="290" y="390">Zona 2</text>
    <text x="512" y="429">Zona 3</text>
    <text x="734" y="390">Zona 4</text>
    <text x="879" y="230">Zona 5</text>
    <text x="145" y="620">Zona 6</text>
    <text x="512" y="620">Zona 7</text>
    <text x="879" y="620">Zona 8</text>
    <text x="512" y="867">Zona 9</text>
  </g>
</svg>
