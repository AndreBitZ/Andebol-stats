<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Baliza de andebol dividida em 9 zonas</title>
  <desc id="desc">Baliza vista de frente com a abertura dividida em três colunas e três linhas iguais.</desc>
  <rect width="900" height="620" fill="#fff"/>
  <!-- baliza -->
  <g fill="none" stroke="#111" stroke-linejoin="round">
    <path d="M90 55 H810 V515 H90 Z" stroke-width="10"/>
    <path d="M90 55 L45 15 H855 L810 55" stroke-width="10"/>
    <path d="M90 515 L45 560 H855 L810 515" stroke-width="10"/>
    <path d="M45 15 V560 M855 15 V560" stroke-width="10"/>
  </g>
  <!-- rede -->
  <g stroke="#999" stroke-width="2" opacity=".75">
    <path d="M110 75 H790 M110 115 H790 M110 155 H790 M110 195 H790 M110 235 H790 M110 275 H790 M110 315 H790 M110 355 H790 M110 395 H790 M110 435 H790 M110 475 H790"/>
    <path d="M130 65 V505 M170 65 V505 M210 65 V505 M250 65 V505 M290 65 V505 M330 65 V505 M370 65 V505 M410 65 V505 M450 65 V505 M490 65 V505 M530 65 V505 M570 65 V505 M610 65 V505 M650 65 V505 M690 65 V505 M730 65 V505 M770 65 V505"/>
  </g>
  <!-- área útil 3x3 -->
  <rect x="110" y="75" width="680" height="430" fill="#fff" stroke="#111" stroke-width="7"/>
  <g stroke="#111" stroke-width="5">
    <path d="M336.666 75 V505 M563.333 75 V505"/>
    <path d="M110 218.333 H790 M110 361.666 H790"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="56" fill="#111" text-anchor="middle" dominant-baseline="middle">
    <text x="223.333" y="146.666">1</text>
    <text x="450" y="146.666">2</text>
    <text x="676.666" y="146.666">3</text>
    <text x="223.333" y="290">4</text>
    <text x="450" y="290">5</text>
    <text x="676.666" y="290">6</text>
    <text x="223.333" y="433.333">7</text>
    <text x="450" y="433.333">8</text>
    <text x="676.666" y="433.333">9</text>
  </g>
</svg>
